services:
  - type: web
    name: mac-analiz-single
    runtime: python
    region: frankfurt
    plan: 1c-2g
    buildCommand: python -m pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    # Migration is an explicit maintenance action. A diagnostic redeploy must
    # never migrate automatically. Clear any old Dashboard Pre-Deploy Command.
    startCommand: node frontend/scripts/run-single-service.mjs
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: BACKEND_PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_NAME
        value: goaloo
      - key: GOALOO_BASE_URL
        value: https://football.goaloo.com
      - key: GOALOO_ODDS_BASE_URL
        value: https://www.goaloo.com
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PROVIDER_REQUESTS_PER_MINUTE
        value: "60"
      - key: PROVIDER_MAX_RETRIES
        value: "3"
      - key: ENABLED_LEAGUES
        value: "36,30,31,8,11,16,7,27,103,113,2187"
      - key: ENABLED_SEASONS
        value: 2023-2024,2024-2025,2025-2026,2026-2027
      - key: HISTORICAL_START_DATE
        value: "2023-07-01"
      - key: HISTORICAL_COLLECT_ODDS
        value: "false"
      - key: POSTGRES_NORMAL_MB
        value: "300"
      - key: POSTGRES_WARNING_MB
        value: "500"
      - key: POSTGRES_HIGH_MB
        value: "750"
      - key: POSTGRES_CRITICAL_MB
        value: "750"
      - key: ACTIVE_STATE_RETENTION_DAYS
        value: "14"
      - key: ODDS_RETENTION_DAYS
        value: "30"
      - key: JOB_HISTORY_RETENTION_DAYS
        value: "30"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
