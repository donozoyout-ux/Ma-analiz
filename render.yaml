services:
  - type: web
    name: mac-analiz-single
    runtime: python
    region: frankfurt
    plan: 1c-2g
    buildCommand: python -m pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: node frontend/scripts/run-single-service.mjs
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:8000
      - key: SINGLE_SERVICE_MODE
        value: "true"
      - key: BACKEND_PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_NAME
        value: goaloo
      - key: GOALOO_BASE_URL
        value: https://football.goaloo.com
      - key: GOALOO_ODDS_BASE_URL
        value: https://www.goaloo.com
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PROVIDER_REQUESTS_PER_MINUTE
        value: "60"
      - key: PROVIDER_MAX_RETRIES
        value: "3"
      - key: ENABLED_LEAGUES
        sync: false
