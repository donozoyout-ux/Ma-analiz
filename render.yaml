services:
  - type: web
    name: mac-analiz-single
    runtime: python
    region: frankfurt
    plan: 1c-2g
    buildCommand: python -m pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    # Migration is an explicit maintenance action. A diagnostic redeploy must
    # never migrate automatically. Clear any old Dashboard Pre-Deploy Command.
    startCommand: node frontend/scripts/run-single-service.mjs
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: ""
      - key: BACKEND_PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_NAME
        value: goaloo
      - key: GOALOO_BASE_URL
        value: https://football.goaloo.com
      - key: GOALOO_ODDS_BASE_URL
        value: https://www.goaloo.com
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PROVIDER_REQUESTS_PER_MINUTE
        value: "60"
      - key: PROVIDER_MAX_RETRIES
        value: "3"
      - key: ENABLED_LEAGUES
        value: "36,30,31,8,11,16,7,27,103,113,2187"
      - key: ENABLED_SEASONS
        value: 2023-2024,2024-2025,2025-2026,2026-2027
      - key: HISTORICAL_START_DATE
        value: "2023-07-01"
      - key: HISTORICAL_COLLECT_ODDS
        value: "false"
      - key: POSTGRES_NORMAL_MB
        value: "300"
      - key: POSTGRES_WARNING_MB
        value: "500"
      - key: POSTGRES_HIGH_MB
        value: "750"
      - key: POSTGRES_CRITICAL_MB
        value: "750"
      - key: ACTIVE_STATE_RETENTION_DAYS
        value: "14"
      - key: ODDS_RETENTION_DAYS
        value: "30"
      - key: JOB_HISTORY_RETENTION_DAYS
        value: "30"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
  - type: worker
    name: mac-analiz-worker
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.worker
    envVars:
      # Set once on this independent worker to enable verified automatic deletion.
      # Application default is false; sync:false preserves an explicit Dashboard choice.
      - key: AUTO_RETENTION_DELETE_ENABLED
        sync: false
      - key: OPERATIONAL_RETENTION_HOURS
        value: "48"
      - key: WORKER_ARCHIVE_INTERVAL_SECONDS
        value: "900"
      - key: WORKER_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_NAME
        value: goaloo
      - key: GOALOO_BASE_URL
        value: https://football.goaloo.com
      - key: GOALOO_ODDS_BASE_URL
        value: https://www.goaloo.com
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PROVIDER_REQUESTS_PER_MINUTE
        value: "60"
      - key: PROVIDER_MAX_RETRIES
        value: "3"
      - key: ENABLED_LEAGUES
        value: "36,30,31,8,11,16,7,27,103,113,2187"
      - key: ENABLED_SEASONS
        value: 2023-2024,2024-2025,2025-2026,2026-2027
      - key: HISTORICAL_START_DATE
        value: "2023-07-01"
      - key: HISTORICAL_COLLECT_ODDS
        value: "false"
      - key: WORKER_INTERVAL_SECONDS
        value: "300"
      - key: WORKER_MATCH_INTERVAL_SECONDS
        value: "3600"
      - key: WORKER_ODDS_INTERVAL_SECONDS
        value: "1800"
      - key: WORKER_RESULTS_INTERVAL_SECONDS
        value: "1800"
      - key: WORKER_SCANNER_INTERVAL_SECONDS
        value: "1800"
      - key: WORKER_PRUNE_INTERVAL_SECONDS
        value: "86400"
      - key: JOB_RUN_STALE_AFTER_SECONDS
        value: "21600"
      - key: HISTORICAL_INGEST_LEASE_SECONDS
        value: "3600"
      - key: JOB_HISTORY_RETENTION_DAYS
        value: "30"
      - key: ACTIVE_STATE_RETENTION_DAYS
        value: "14"
      - key: ODDS_RETENTION_DAYS
        value: "30"
      - key: POSTGRES_NORMAL_MB
        value: "300"
      - key: POSTGRES_WARNING_MB
        value: "500"
      - key: POSTGRES_HIGH_MB
        value: "750"
      - key: POSTGRES_CRITICAL_MB
        value: "750"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
  - type: cron
    name: mac-analiz-daily-archive
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 2 * * *"
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.jobs.daily_archive
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: PROVIDER_NAME
        value: goaloo
      - key: GOALOO_BASE_URL
        value: https://football.goaloo.com
      - key: GOALOO_ODDS_BASE_URL
        value: https://www.goaloo.com
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: PROVIDER_REQUESTS_PER_MINUTE
        value: "60"
      - key: PROVIDER_MAX_RETRIES
        value: "3"
      - key: ENABLED_LEAGUES
        value: "36,30,31,8,11,16,7,27,103,113,2187"
      - key: ENABLED_SEASONS
        value: 2023-2024,2024-2025,2025-2026,2026-2027
      - key: HISTORICAL_START_DATE
        value: "2023-07-01"
      - key: HISTORICAL_COLLECT_ODDS
        value: "false"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: JOB_HISTORY_RETENTION_DAYS
        value: "30"
      - key: ACTIVE_STATE_RETENTION_DAYS
        value: "14"
      - key: ODDS_RETENTION_DAYS
        value: "30"
      - key: POSTGRES_NORMAL_MB
        value: "300"
      - key: POSTGRES_WARNING_MB
        value: "500"
      - key: POSTGRES_HIGH_MB
        value: "750"
      - key: POSTGRES_CRITICAL_MB
        value: "750"
