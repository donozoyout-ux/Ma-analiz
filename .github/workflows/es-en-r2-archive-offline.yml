name: La Liga and Premier League R2 archive validation
on:
  pull_request:
    paths:
      - 'backend/app/jobs/es_en_season_r2.py'
      - 'backend/tests/test_es_en_season_r2.py'
      - '.github/workflows/es-en-r2-archive-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q tests/test_es_en_season_r2.py
        working-directory: backend
      - name: Validate six pinned actual CC0 source snapshots with zero R2 requests
        run: python -m app.jobs.es_en_season_r2
        working-directory: backend
        env:
          MAC_ANALIZ_TEST_MODE: "1"
