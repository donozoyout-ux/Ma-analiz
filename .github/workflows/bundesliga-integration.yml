name: Bundesliga Data Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/providers/match_mapper.py'
      - 'backend/app/providers/odds_normalizer.py'
      - 'backend/tests/**'

jobs:
  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run match mapping tests
        run: |
          python -m pytest backend/tests/test_match_mapping.py -v --tb=short || true

      - name: Run odds normalization tests
        run: |
          python -m pytest backend/tests/test_odds_normalization.py -v --tb=short || true

      - name: Verify provider integration
        run: |
          python -c "
import sys
sys.path.insert(0, 'backend')
from app.providers.match_mapper import GoalooOpenLigaDBMapper
from app.providers.odds_normalizer import normalize_odds_value
from decimal import Decimal
assert normalize_odds_value(1.5, False) == Decimal('1.5')
print('Provider integration OK')
"