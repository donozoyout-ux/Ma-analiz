name: Retention schedule watchdog
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ma-analiz-retention-watchdog
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Detect stale, disabled, failed or cancelled retention schedules
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m app.jobs.actions_watchdog
