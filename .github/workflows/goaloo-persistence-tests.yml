name: Goaloo SQL R2 Isolated Integration
on:
  pull_request:
    paths:
      - 'backend/app/jobs/goaloo_verified_import.py'
      - 'backend/app/jobs/goaloo_daily_collect.py'
      - 'backend/tests/test_goaloo_verified_import.py'
      - 'backend/tests/test_goaloo_daily_collect.py'
      - '.github/workflows/goaloo-persistence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Isolated database and R2 tests (no network writes)
        working-directory: backend
        env:
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
        run: python -m pytest -q tests/test_goaloo_verified_import.py tests/test_goaloo_match_identity.py tests/test_goaloo_odds_audit.py tests/test_goaloo_daily_collect.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goaloo_test
          POSTGRES_PASSWORD: goaloo_test_only
          POSTGRES_DB: goaloo_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U goaloo_test -d goaloo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Isolated PostgreSQL 16 and in-memory R2 importer contract
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://goaloo_test:goaloo_test_only@127.0.0.1:5432/goaloo_ci
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
        run: python -m pytest -q tests/test_goaloo_verified_import.py tests/test_goaloo_daily_collect.py
