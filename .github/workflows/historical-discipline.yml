name: Historical corner and card archive (isolated)
on:
  pull_request:
    paths:
      - 'backend/app/historical/discipline_*'
      - 'backend/app/models/historical_discipline.py'
      - 'backend/app/jobs/historical_discipline_import.py'
      - 'backend/app/jobs/discipline_source_download.py'
      - 'backend/app/jobs/discipline_batch_upload.py'
      - 'backend/app/api/historical_discipline.py'
      - 'backend/migrations/versions/0011_historical_discipline.py'
      - 'backend/tests/test_historical_discipline_*'
      - 'backend/tests/test_discipline_source_download.py'
      - 'frontend/src/components/section-views/discipline.tsx'
      - '.github/workflows/historical-discipline.yml'
  workflow_dispatch:

jobs:
  isolated-postgres:
    name: isolated-postgres-pg${{ matrix.pg_version }}
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["16", "18"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_USER: discipline_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: discipline_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55472:5432
        options: >-
          --health-cmd "pg_isready -U discipline_test -d discipline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://discipline_test@127.0.0.1:55472/discipline_test
      DISCIPLINE_TEST_DATABASE_URL: postgresql+psycopg://discipline_test@127.0.0.1:55472/discipline_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Empty schema creation and safe rollback
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0010_active_statistics
          python -m alembic upgrade head
      - name: Offline CSV, statistical denominator and isolated SQL tests
        run: python -m pytest tests/test_historical_discipline_csv.py tests/test_historical_discipline_stats.py tests/test_historical_discipline_r2.py tests/test_historical_discipline_postgres.py tests/test_discipline_source_download.py -q
      - name: Nonempty downgrade refuses to erase historical evidence
        shell: bash
        run: |
          if python -m alembic downgrade 0010_active_statistics > "$RUNNER_TEMP/discipline-downgrade.log" 2>&1; then
            echo "Unexpectedly destroyed populated historical statistics"
            exit 1
          fi
          grep -q DISCIPLINE_ARCHIVE_NOT_EMPTY_BACKUP_REQUIRED "$RUNNER_TEMP/discipline-downgrade.log"
