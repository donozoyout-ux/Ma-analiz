name: Real Source Bulletin Tests
on:
  pull_request:
    paths:
      - 'backend/app/api/source_bulletin.py'
      - 'backend/app/providers/openligadb.py'
      - 'backend/tests/test_source_bulletin.py'
      - 'frontend/src/components/source-bulletin.tsx'
      - 'frontend/src/app/globals.css'
      - 'frontend/src/components/football-home.tsx'
      - 'frontend/src/components/match-center.tsx'
      - 'frontend/src/components/section-views/matches.tsx'
      - 'frontend/src/components/section-views/archive.tsx'
      - 'frontend/src/components/overview-metrics.tsx'
      - '.github/workflows/source-bulletin-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run read-only source bulletin and existing fixture regressions
        working-directory: backend
        env:
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
        run: python -m pytest tests/test_source_bulletin.py tests/test_european_cups.py tests/test_bundesliga_ingestion.py -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
