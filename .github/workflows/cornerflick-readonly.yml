name: Cornerflick offline read-only adapter
on:
  pull_request:
    paths:
      - 'backend/app/providers/cornerflick_open_data.py'
      - 'backend/app/providers/cornerflick_schema_inspect.py'
      - 'backend/tests/test_cornerflick_open_data.py'
      - 'backend/tests/test_cornerflick_schema_inspect.py'
      - '.github/workflows/cornerflick-readonly.yml'
  workflow_dispatch:

jobs:
  mock-transport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline Cornerflick HTTP and JSON schema tests
        run: python -m pytest tests/test_cornerflick_open_data.py tests/test_cornerflick_schema_inspect.py -q
