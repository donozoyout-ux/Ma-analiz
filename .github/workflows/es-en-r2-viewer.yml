name: ES EN R2 reader and frontend
on:
  pull_request:
    paths:
      - 'backend/app/api/es_en_r2_archive.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_es_en_r2_archive.py'
      - 'frontend/src/components/r2-bundesliga-archive.tsx'
      - '.github/workflows/es-en-r2-viewer.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q tests/test_es_en_r2_archive.py tests/test_bundesliga_r2_archive.py
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
