name: Android APK Build (TWA)
run-name: Android APK Build ${{ github.event_name }} ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'
  push:
    branches: [feature/android-app-push]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-analiz-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
