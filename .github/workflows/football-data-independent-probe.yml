name: Bundesliga Independent Score Probe (read only)

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'Explicit Bundesliga match date (UTC, YYYY-MM-DD)'
        required: true
        type: string
      matchday:
        description: 'Bundesliga matchday (1-34)'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: football-data-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOOTBALL_DATA_ORG_API_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_API_TOKEN }}
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      OPERATIONAL_DELETE_ENABLED: 'false'
      BUNDESLIGA_INGEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit scope
        env:
          TARGET_DAY: ${{ inputs.day }}
          MATCHDAY: ${{ inputs.matchday }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          day = date.fromisoformat(os.environ["TARGET_DAY"])
          assert day.year in (2026, 2027)
          assert 1 <= int(os.environ["MATCHDAY"]) <= 34
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Probe two official sources without SQL or R2 access
        working-directory: backend
        env:
          TARGET_DAY: ${{ inputs.day }}
          MATCHDAY: ${{ inputs.matchday }}
        run: python -m app.jobs.football_data_probe --day "$TARGET_DAY" --matchday "$MATCHDAY"
