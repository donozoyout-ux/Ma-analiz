name: Read-only match collector
on:
  schedule:
    - cron: '19 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-collector.yml'
      - 'backend/app/jobs/match_collector.py'
      - 'backend/app/providers/collector*'
      - 'backend/app/providers/multileague.py'
      - 'backend/tests/test_match_collector.py'

permissions:
  contents: read

concurrency:
  group: ma-analiz-read-only-match-collector
  cancel-in-progress: false

env:
  AUTO_RETENTION_DELETE_ENABLED: 'false'
  OPERATIONAL_DELETE_ENABLED: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install collector-only dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'pytest>=8.3,<10' 'tzdata>=2024.1'
      - name: Offline safety tests
        working-directory: backend
        run: python -m pytest -q tests/test_match_collector.py tests/test_multileague_probe.py
      - name: Restore disposable public HTTP cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: backend/.collector/state.json
          key: match-collector-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: match-collector-v1-
      - name: Read public sources only
        working-directory: backend
        run: python -m app.jobs.match_collector
      - name: Save bounded cache and cooldowns even after a source failure
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: backend/.collector/state.json
          key: match-collector-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report setup or test failure without raw errors
        if: always()
        run: |
          if [ ! -f backend/.collector/report.json ]; then
            mkdir -p backend/.collector
            printf '%s\n' '{"status":"WORKFLOW_STOPPED_BEFORE_REPORT","SQL_WRITE":"NOT_RUN","R2_WRITE":"NOT_RUN","LIVE_DELETE":"NOT_RUN"}' > backend/.collector/report.json
          fi
      - name: Publish safe audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: match-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/.collector/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Failure notification
        if: failure()
        run: echo '::error::COLLECTOR_FAILED_OR_BLOCKED - inspect the safe JSON artifact; production writes are disabled.'
