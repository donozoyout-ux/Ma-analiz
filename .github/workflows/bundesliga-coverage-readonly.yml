name: Bundesliga source-to-SQL coverage (manual read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: '1-3 UTC dates, e.g. 2026-08-28'
        required: true
        type: string
      matchday:
        description: 'Bundesliga matchday 1-34'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: bundesliga-source-sql-coverage-readonly
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_ORG_API_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_API_TOKEN }}
      OPERATIONAL_DELETE_ENABLED: 'false'
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      BUNDESLIGA_INGEST_ENABLED: 'false'
      BUNDESLIGA_INGEST_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check credentials are configured without printing values
        run: |
          python - <<'PY'
          import os
          for key in ("DATABASE_URL", "FOOTBALL_DATA_ORG_API_TOKEN"):
              if not os.environ.get(key):
                  raise ValueError("MISSING_SECRET_" + key)
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Report real two-source to SQL coverage with read-only transaction
        working-directory: backend
        env:
          TARGET_DAYS: ${{ inputs.days }}
          MATCHDAY: ${{ inputs.matchday }}
        run: |
          set -euo pipefail
          python -m app.jobs.bundesliga_coverage_report --days "$TARGET_DAYS" --matchday "$MATCHDAY" --read-sql
