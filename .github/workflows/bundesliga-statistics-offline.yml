name: Bundesliga statistics offline tests
on:
  pull_request:
    paths:
      - 'backend/app/statistics/**'
      - 'backend/app/jobs/bundesliga_statistics_pilot.py'
      - 'backend/tests/test_bundesliga_statistics_offline.py'
      - '.github/workflows/bundesliga-statistics-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q -s tests/test_bundesliga_statistics_offline.py tests/test_test_isolation.py
        working-directory: backend
