name: Isolated season bulk tests
on:
  pull_request:
    paths:
      - 'backend/app/**/season_*.py'
      - 'backend/migrations/versions/0011_season_bulk.py'
      - 'backend/tests/test_season_bulk.py'
      - 'backend/app/jobs/season_staging_rehearsal.py'
      - 'backend/app/jobs/season_bulk_preflight.py'
      - '.github/workflows/season-bulk-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: season_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d season_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_season_bulk.py
        env:
          SEASON_BULK_TEST_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
      - name: Refuse unconfigured and mismatched identity preflight
        env:
          SEASON_BULK_PREFLIGHT_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: |
          python - <<'PY'
          from app.jobs.season_bulk_preflight import main
          assert main(["--expected-database", "wrong_database"]) == 2
          print("MISMATCH_PRECHECK_BLOCKED")
          PY
      - name: Upgrade disposable database to existing Alembic 0010 head
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: python -m alembic upgrade 0010_active_statistics
      - name: Inspect baseline before season migration
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          e=create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              assert c.scalar(text("SELECT version_num FROM alembic_version")) == "0010_active_statistics"
              assert c.scalar(text("SELECT COUNT(*) FROM active_matches")) == 0
          print("DISPOSABLE_0010_BASELINE_PASS")
          PY
      - name: Validate read-only identity before migration
        env:
          SEASON_BULK_PREFLIGHT_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: python -m app.jobs.season_bulk_preflight --expected-database season_test
      - name: Upgrade disposable PostgreSQL 0010 to 0011
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: python -m alembic upgrade 0011_season_bulk
      - name: Validate read-only identity after migration
        env:
          SEASON_BULK_PREFLIGHT_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: python -m app.jobs.season_bulk_preflight --expected-database season_test --require-migrated
      - name: Rehearse pinned 2024-25 UCL 189-match import and replay (no actual R2)
        env:
          DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
          SEASON_BULK_TEST_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
        run: python -m app.jobs.season_staging_rehearsal
