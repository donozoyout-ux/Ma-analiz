name: Isolated season bulk tests
on:
  pull_request:
    paths:
      - 'backend/app/**/season_*.py'
      - 'backend/migrations/versions/0011_season_bulk.py'
      - 'backend/tests/test_season_bulk.py'
      - '.github/workflows/season-bulk-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: season_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d season_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_season_bulk.py
        env:
          SEASON_BULK_TEST_DATABASE_URL: postgresql+psycopg://test:test-only@localhost:5432/season_test
