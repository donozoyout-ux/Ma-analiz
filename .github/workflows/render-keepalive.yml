name: Render keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render service
        env:
          RENDER_URL: https://ma-analiz-2.onrender.com/
        run: |
          set -e
          status="$(curl --max-time 30 -sS -o /dev/null -w "%{http_code}" "$RENDER_URL")"
          echo "Render response: HTTP $status"
          case "$status" in
            2*|3*|4*|5*) exit 0 ;;
            *) echo "Render request did not return a valid HTTP status"; exit 1 ;;
          esac
