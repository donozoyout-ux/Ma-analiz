name: Render keepalive

# Render Free web services can sleep after 15 minutes without inbound requests.
# Best-effort pings only: GitHub scheduled jobs may run late or be skipped.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render FastAPI liveness endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 0 \
            --output /dev/null \
            --write-out "Render liveness HTTP %{http_code} total_seconds=%{time_total} connect_seconds=%{time_connect}\\n" \
            "https://ma-analiz-2.onrender.com/health/live"
