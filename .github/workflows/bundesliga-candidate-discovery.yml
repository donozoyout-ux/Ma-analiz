name: Bundesliga multi-day verification candidate discovery (read only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: '1–3 comma-separated UTC dates (2026-11-20,2026-11-21,2026-11-22)'
        type: string
        required: true
      matchday:
        description: 'Bundesliga round number, 1–34'
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: bundesliga-independent-discovery-readonly
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_ORG_API_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_API_TOKEN }}
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      OPERATIONAL_DELETE_ENABLED: 'false'
      BUNDESLIGA_INGEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate date bounds and read-only configuration
        env:
          TARGET_DAYS: ${{ inputs.days }}
          MATCHDAY: ${{ inputs.matchday }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta, timezone
          raw=os.environ["TARGET_DAYS"]
          days=raw.split(",")
          assert 1 <= len(days) <= 3
          parsed=[date.fromisoformat(v.strip()) for v in days]
          now=datetime.now(timezone.utc).date()
          assert len(set(parsed)) == len(parsed)
          assert all(now-timedelta(days=120) <= d <= now for d in parsed)
          assert 1 <= int(os.environ["MATCHDAY"]) <= 34
          assert bool(os.environ.get("DATABASE_URL"))
          assert bool(os.environ.get("FOOTBALL_DATA_ORG_API_TOKEN"))
          PY
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Discover matching 2-source final scores in existing SQL (no writes)
        working-directory: backend
        env:
          TARGET_DAYS: ${{ inputs.days }}
          MATCHDAY: ${{ inputs.matchday }}
        run: |
          set -euo pipefail
          python -m app.jobs.bundesliga_candidate_discovery --days "$TARGET_DAYS" --matchday "$MATCHDAY"
