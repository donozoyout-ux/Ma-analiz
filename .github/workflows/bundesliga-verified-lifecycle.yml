name: Bundesliga verified fixture lifecycle archive (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run is read only; live writes only verified R2 snapshot and metadata'
        required: true
        type: choice
        options: [dry-run, live]
        default: dry-run
      approval:
        description: 'Only for live: ARCHIVE_ONE_VERIFIED_MATCH_ONLY'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bundesliga-verified-lifecycle-single-fixture
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_REGION: auto
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      OPERATIONAL_DELETE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required secrets and manual mode
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          assert os.environ["MODE"] in ("dry-run", "live")
          if os.environ["MODE"] == "live":
              assert os.environ["APPROVAL"] == "ARCHIVE_ONE_VERIFIED_MATCH_ONLY"
          for name in ["DATABASE_URL"] + (["R2_ENDPOINT", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_BUCKET"]
                if os.environ["MODE"] == "live" else []):
              if not os.environ.get(name):
                  raise ValueError("Missing secret: " + name)
          PY
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Archive one verified result, no SQL delete
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = live ]; then
            python -m app.jobs.verified_lifecycle_archive --live --approval "$APPROVAL"
          else
            python -m app.jobs.verified_lifecycle_archive
          fi
