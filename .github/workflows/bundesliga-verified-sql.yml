name: Bundesliga verified score SQL preflight (manual)

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC date, e.g. 2026-08-28'
        required: true
        type: string
      matchday:
        description: 'Bundesliga round 1-34'
        required: true
        type: number
      mode:
        description: 'Dry-run default; SQL verification write requires live and explicit approval'
        required: true
        type: choice
        options:
          - dry-run
          - live
        default: dry-run
      approval:
        description: 'For live only, type VERIFY_ONE_MATCH_ONLY'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bundesliga-independent-verification-sql
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_ORG_API_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_API_TOKEN }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      OPERATIONAL_DELETE_ENABLED: 'false'
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      BUNDESLIGA_INGEST_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit date / approval without leaking credentials
        env:
          TARGET_DAY: ${{ inputs.day }}
          MATCHDAY: ${{ inputs.matchday }}
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import date
          day = date.fromisoformat(os.environ['TARGET_DAY'])
          assert day.year in (2026, 2027)
          assert 1 <= int(os.environ['MATCHDAY']) <= 34
          assert os.environ['MODE'] in ('dry-run', 'live')
          if os.environ['MODE'] == 'live':
              assert os.environ['APPROVAL'] == 'VERIFY_ONE_MATCH_ONLY'
          for key in ['DATABASE_URL', 'FOOTBALL_DATA_ORG_API_TOKEN']:
              if not os.environ.get(key):
                  raise ValueError(f'Missing secret: {key}')
          if os.environ['MODE'] == 'live':
              for key in ['R2_ENDPOINT', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET']:
                  if not os.environ.get(key):
                      raise ValueError(f'Missing secret: {key}')
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run independent Bundesliga check (SQL write requires live approval)
        working-directory: backend
        env:
          TARGET_DAY: ${{ inputs.day }}
          MATCHDAY: ${{ inputs.matchday }}
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "live" ]; then
            python -m app.jobs.bundesliga_verified_runner --day "$TARGET_DAY" --matchday "$MATCHDAY" --live --approval "$APPROVAL"
          else
            python -m app.jobs.bundesliga_verified_runner --day "$TARGET_DAY" --matchday "$MATCHDAY"
          fi
