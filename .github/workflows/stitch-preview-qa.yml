name: Stitch preview QA (isolated)
run-name: Stitch desktop/mobile QA ${{ github.sha }}

on:
  push:
    branches: [codex/stitch-preview-refinement]
    paths:
      - 'frontend/**'
      - '.github/workflows/stitch-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stitch-preview-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-stitch:
    name: Stitch preview unit, build, screenshot and accessibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Run isolated frontend server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3106 > "$RUNNER_TEMP/stitch-next.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/stitch-next.pid"
          for i in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3106/stitch-preview; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/stitch-next.log"
          exit 1
      - name: Synthetic API browser QA - 4 widths, six screens, 12 screenshots
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then echo "CHROME_BINARY_MISSING"; exit 1; fi
          npm run test:stitch-browser -- http://127.0.0.1:3106 reports/stitch-preview
      - name: Save rendered preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-preview-12-screens-${{ github.sha }}
          path: frontend/reports/stitch-preview/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stitch-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/stitch-next.pid")" || true
          fi
