name: Goaloo Identity and Odds Safety Tests
on:
  pull_request:
    paths:
      - 'backend/app/providers/goaloo_match_identity.py'
      - 'backend/app/providers/goaloo_odds_audit.py'
      - 'backend/tests/test_goaloo_match_identity.py'
      - 'backend/tests/test_goaloo_odds_audit.py'
      - '.github/workflows/goaloo-matching-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Isolated Goaloo matching, odds and existing regression tests
        working-directory: backend
        env:
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
        run: python -m pytest -q tests/test_goaloo_match_identity.py tests/test_goaloo_odds_audit.py tests/test_goaloo_provider.py tests/test_bundesliga_ingestion.py
