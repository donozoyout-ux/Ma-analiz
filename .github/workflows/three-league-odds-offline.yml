name: Three-league odds offline tests
on:
  pull_request:
    paths:
      - 'backend/app/analytics/three_league_odds_offline.py'
      - 'backend/tests/test_three_league_odds_offline.py'
      - '.github/workflows/three-league-odds-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q tests/test_three_league_odds_offline.py
        working-directory: backend
