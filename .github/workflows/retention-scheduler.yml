name: Retention scheduler
run-name: Retention ${{ github.event_name == 'schedule' && (github.event.schedule == '2 * * * *' && 'auto' || 'archive') || inputs.mode || 'dry-run' }}

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run never deletes; archive writes immutable snapshots; auto uses the repository variable'
        type: choice
        default: dry-run
        options: [dry-run, archive, auto]
  push:
    branches: [main]
    paths:
      - '.github/workflows/retention-scheduler.yml'
      - '.github/workflows/retention-watchdog.yml'
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'backend/requirements.txt'
      - 'backend/migrations/**'

permissions:
  contents: read

concurrency:
  group: ma-analiz-retention
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Local-adapter safety tests without production secrets
        run: |
          touch .env
          cd backend
          python -m pytest -q --ignore=tests/test_goaloo_live.py --ignore=tests/test_live_integrations.py --ignore=tests/test_backup_before_migration.py

  retention:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verified retention invocation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: auto
          OPERATIONAL_RETENTION_HOURS: '48'
          OPERATIONAL_DELETE_ENABLED: 'false'
          AUTO_RETENTION_DELETE_ENABLED: ${{ github.event_name != 'push' && (github.event_name == 'schedule' || inputs.mode == 'auto') && vars.AUTO_RETENTION_DELETE_ENABLED == 'true' && 'true' || 'false' }}
          RETENTION_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '2 * * * *' && 'auto' || 'archive') || inputs.mode || 'dry-run' }}
        run: |
          if [ "$RETENTION_MODE" = auto ] && [ "$AUTO_RETENTION_DELETE_ENABLED" = true ]; then
            python -m app.jobs.actions_retention --mode dry-run
          fi
          python -m app.jobs.actions_retention --mode "$RETENTION_MODE"
