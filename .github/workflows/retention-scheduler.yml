name: Retention scheduler
run-name: Retention ${{ github.event_name == 'pull_request' && 'tests-only (no storage)' || github.event_name == 'schedule' && (github.event.schedule == '2 * * * *' && 'auto' || 'archive') || inputs.mode || 'dry-run' }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/retention-scheduler.yml'
      - '.github/workflows/retention-watchdog.yml'
      - 'backend/**'
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run never deletes; archive writes immutable snapshots; auto uses the repository variable'
        type: choice
        default: dry-run
        options: [dry-run, archive, auto]
  push:
    branches: [main]
    paths:
      - '.github/workflows/retention-scheduler.yml'
      - '.github/workflows/retention-watchdog.yml'
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'backend/requirements.txt'
      - 'backend/migrations/**'

permissions:
  contents: read

concurrency:
  # PR validation cannot replace a pending production maintenance run.
  group: ma-analiz-retention${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Local-adapter safety tests without production secrets
        run: |
          touch .env
          cd backend
          python -m pytest -q --ignore=tests/test_goaloo_live.py --ignore=tests/test_live_integrations.py --ignore=tests/test_backup_before_migration.py

  retention:
    needs: validate
    # Tests-only fixes still run the full suite, without SQL audit/archive writes.
    # This opt-out applies only to push; scheduled and manual maintenance are unchanged.
    # PRs run secret-free tests only; never open the production audit connection.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[tests-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verified retention invocation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: auto
          OPERATIONAL_RETENTION_HOURS: '48'
          OPERATIONAL_DELETE_ENABLED: 'false'
          AUTO_RETENTION_DELETE_ENABLED: ${{ github.event_name != 'push' && (github.event_name == 'schedule' || inputs.mode == 'auto') && vars.AUTO_RETENTION_DELETE_ENABLED == 'true' && 'true' || 'false' }}
          RETENTION_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '2 * * * *' && 'auto' || 'archive') || inputs.mode || 'dry-run' }}
          RETENTION_REPORT_PATH: retention-report.json
        run: |
          if [ "$RETENTION_MODE" = auto ] && [ "$AUTO_RETENTION_DELETE_ENABLED" = true ]; then
            python -m app.jobs.actions_retention --mode dry-run
          fi
          python -m app.jobs.actions_retention --mode "$RETENTION_MODE"
      - name: Safe invocation evidence (not proof of new R2 data)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/retention-report.json
          retention-days: 14
          if-no-files-found: warn
