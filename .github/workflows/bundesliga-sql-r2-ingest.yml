name: Bundesliga PostgreSQL and R2 daily ingest
on:
  schedule:
    # Istanbul 09:10 and 21:10: update today's fixtures and scores
    - cron: '10 6,18 * * *'
    # Istanbul 01:10: finalize previous local calendar day
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (read only) or live (explicit SQL+R2 write)'
        type: choice
        options: [dry-run, live]
        default: dry-run
      day:
        description: 'Optional YYYY-MM-DD Istanbul match date (empty = current / previous at 22:10 UTC)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/bundesliga-sql-r2-ingest.yml'
      - 'backend/app/jobs/bundesliga_daily.py'
      - 'backend/app/jobs/bundesliga_pipeline.py'
      - 'backend/app/providers/openligadb.py'
      - 'backend/app/storage/archive.py'
      - 'backend/app/storage/quota.py'
      - 'backend/tests/test_bundesliga_ingestion.py'
permissions:
  contents: read
concurrency:
  group: bundesliga-sql-r2-live
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Isolated ingestion/archive safety regressions
        working-directory: backend
        env:
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          OPERATIONAL_DELETE_ENABLED: 'false'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
        run: python -m pytest -q tests/test_bundesliga_ingestion.py
  ingest:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.BUNDESLIGA_SCHEDULED_LIVE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_REGION: auto
      ENABLED_LEAGUES: '8'
      ENABLED_SEASONS: '2026-2027'
      OPERATIONAL_RETENTION_HOURS: '32'
      OPERATIONAL_DELETE_ENABLED: 'false'
      AUTO_RETENTION_DELETE_ENABLED: 'false'
      BUNDESLIGA_INGEST_ENABLED: 'true'
      BUNDESLIGA_INGEST_DRY_RUN: 'false'
      BUNDESLIGA_DAILY_MAX_REQUESTS: '3'
      BUNDESLIGA_DAILY_MAX_MATCHES: '50'
      BUNDESLIGA_DAILY_MAX_R2_WRITES: '5'
      BUNDESLIGA_DAILY_MAX_ARCHIVE_MB: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Guard required SQL/R2 credentials (no secret values printed)
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        shell: bash
        run: |
          for variable in DATABASE_URL R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required secret: $variable"
              exit 1
            fi
          done
      - name: Run bounded Bundesliga live ingestion with independent R2 receipt
        working-directory: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DAY: ${{ inputs.day }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          mode = os.getenv("INPUT_MODE") if os.getenv("EVENT_NAME") == "workflow_dispatch" else "live"
          day = os.getenv("INPUT_DAY", "").strip()
          if day:
              from datetime import date
              day = date.fromisoformat(day).isoformat()
          else:
              today = datetime.now(ZoneInfo("Europe/Istanbul")).date()
              day = (today - timedelta(days=1) if os.getenv("EVENT_SCHEDULE") == "10 22 * * *" else today).isoformat()
          args = [sys.executable, "-m", "app.jobs.bundesliga_daily", "--date", day]
          if mode == "live":
              args.append("--live")
          print(f"Bundesliga ingest: day={day} mode={mode}; no delete enabled", flush=True)
          subprocess.run(args, check=True)
          PY
