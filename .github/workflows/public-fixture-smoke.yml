name: Public fixture source HTTP smoke (read-only)
on:
  pull_request:
    paths: ['.github/workflows/public-fixture-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read OpenLigaDB public fixtures and deployed homepage API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"MacAnaliz-ReadOnlySmoke/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=25) as response:
                  return json.load(response)

          leagues={"bl1":"Bundesliga","ucl":"Champions League","uel2026":"Europa League","uecl2026":"Conference League"}
          healthy=0
          for shortcut,name in leagues.items():
              try:
                  data=get(f"https://api.openligadb.de/getmatchdata/{shortcut}/2026")
                  if not isinstance(data,list):
                      raise ValueError("Unexpected source response")
                  valid=sum(isinstance(row,dict) and row.get("matchID") is not None for row in data)
                  print(f"{name}: HTTP_OK, fixture_rows={valid}")
                  healthy+=int(valid>0)
              except Exception as exc:
                  print(f"{name}: HTTP_SOURCE_FAILED ({type(exc).__name__})")
          try:
              info=get("https://ma-analiz-2.onrender.com/api/v1/source-bulletin")
              available=info.get("available_leagues",[])
              print(f"Render source bulletin: HTTP_OK, matches={len(info.get('matches',[]))}, available_leagues={available}, failures={info.get('failures',[])}")
              if not available:
                  raise ValueError("No live source connected")
          except Exception as exc:
              print(f"Render source bulletin: HTTP_FAILED ({type(exc).__name__})")
              raise
          if healthy < 1:
              raise SystemExit("No provider returned any valid fixture data")
          PY
