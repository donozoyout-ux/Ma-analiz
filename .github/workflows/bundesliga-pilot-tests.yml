name: Bundesliga Pilot Safety Tests

on:
  pull_request:
    paths:
      - 'backend/app/providers/openligadb.py'
      - 'backend/app/jobs/bundesliga_*.py'
      - 'backend/app/storage/quota.py'
      - 'backend/tests/test_bundesliga_ingestion.py'
      - 'backend/tests/test_bundesliga_postgres_quota.py'
      - '.github/workflows/bundesliga-pilot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Bundesliga SQLite / in-memory R2 safety suite (no production secrets)
        working-directory: backend
        env:
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
        run: python -m pytest tests/test_bundesliga_ingestion.py -q

  postgres-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot-test-only
          POSTGRES_DB: pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify durable quota against isolated PostgreSQL
        working-directory: backend
        env:
          BUNDESLIGA_TEST_DATABASE_URL: postgresql+psycopg://pilot:pilot-test-only@localhost:5432/pilot
          BUNDESLIGA_INGEST_ENABLED: 'false'
          BUNDESLIGA_INGEST_DRY_RUN: 'true'
          AUTO_RETENTION_DELETE_ENABLED: 'false'
          OPERATIONAL_DELETE_ENABLED: 'false'
        run: python -m pytest tests/test_bundesliga_postgres_quota.py -q
